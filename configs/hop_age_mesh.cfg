// More hops first; equal hops use the earliest flit injection time.
topology = mesh;
k = 4;
n = 2;
routing_function = dim_order;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 4;
traffic = uniform;
injection_rate = 0.05;
priority = hop_count;
vc_priority_donation = 0;
sw_allocator = separable_input_first(hop_age);
vc_allocator = islip;
speculative = 0;
hold_switch_for_packet = 0;
sim_type = latency;
sample_period = 1000;
max_samples = 20;
seed = 1;
